<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Buon San Valentino ❤️</title>
  <style>
    body {
      font-family: 'Helvetica', sans-serif;
      background: #ffe6ec;
      color: #333;
      text-align: center;
      padding: 40px;
    }
    h1 { font-size: 3rem; color: #d6336c; }
    .card {
      background: white;
      padding: 20px;
      margin: 20px auto;
      border-radius: 12px;
      max-width: 600px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }
    button {
      background: #d6336c;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <h1>Buon San Valentino ❤️</h1>
  <p>Ti amo da morire piccola mi.</p>

  <div class="card">
    <h2>Perché ti amo</h2>
    <ul style="text-align:left;">
      <li>Perché rendi ogni giorno più bello.</li>
      <li>Perché sai farmi sorridere sempre.</li>
      <li>Perché con te mi sento a casa.</li>
    </ul>
  </div>

  <div class="card">
    <h2>La nostra storia</h2>
    <p>Dal primo giorno in cui ti ho incontrata/o, tutto è cambiato.</p>
  </div>

  <button onclick="alert('Ti amo ❤️')">Apri il regalo</button>

</body>
</html>
